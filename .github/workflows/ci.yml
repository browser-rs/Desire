name: CI

# 与本地完全相同的编译器：xcode-27 镜像里的 Xcode 27.1 (27A9275) 就是本机版本
# （镜像里另有 27.0/27.2 beta；我们显式选 27.1）。因此本地"零警告"与 CI 结论一致，
# push 时就能发现编译/警告问题，而不是等到发版。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust build
        run: cargo build --workspace

  build-arm64:
    name: Build arm64 (zero warnings)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1 (same build as local)
        run: |
          XCODE=/Applications/Xcode_27.1.app
          [ -d "$XCODE" ] || { echo "::error::pinned Xcode 27.1 missing"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27.1" || { echo "::error::expected Xcode 27.1"; exit 1; }

      - name: Pure-logic unit tests
        run: bash tests/run.sh

      - name: Build Release (zero warnings)
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-arm64" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee build-arm64.log
          if grep -E "warning:" build-arm64.log | grep -v appintentsmetadataprocessor | grep -q .; then
            echo "::error::arm64 build emitted warnings"
            grep -E "warning:" build-arm64.log | grep -v appintentsmetadataprocessor | head -30
            exit 1
          fi
          APP="$RUNNER_TEMP/dd-arm64/Build/Products/Release/Desire.app"
          EXPECTED=$(grep -m1 "MARKETING_VERSION = " apps/macos/Desire.xcodeproj/project.pbxproj | grep -o '[0-9.]\+')
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$VER" = "$EXPECTED" ] || { echo "::error::built version $VER != $EXPECTED"; exit 1; }
          echo "arm64 OK: $VER"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-arm64-log
          path: build-arm64.log
          if-no-files-found: ignore

  build-x86_64:
    name: Build x86_64 (zero warnings)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1 (same build as local)
        run: |
          XCODE=/Applications/Xcode_27.1.app
          [ -d "$XCODE" ] || { echo "::error::pinned Xcode 27.1 missing"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27.1" || { echo "::error::expected Xcode 27.1"; exit 1; }

      - name: Build Release x86_64 (zero warnings)
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-x86" \
            -destination 'platform=macOS' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee build-x86.log
          if grep -E "warning:" build-x86.log | grep -v appintentsmetadataprocessor | grep -q .; then
            echo "::error::x86_64 build emitted warnings"
            grep -E "warning:" build-x86.log | grep -v appintentsmetadataprocessor | head -30
            exit 1
          fi
          APP="$RUNNER_TEMP/dd-x86/Build/Products/Release/Desire.app"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Desire")
          [[ "$ARCHS" == *x86_64* ]] || { echo "::error::x86_64 binary missing: $ARCHS"; exit 1; }
          echo "x86_64 OK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-x86-log
          path: build-x86.log
          if-no-files-found: ignore
