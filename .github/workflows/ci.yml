name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pure-logic unit tests (swiftc harness)
        run: bash tests/run.sh

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Launch app for eval (automation bridge)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Desire.app" -path "*Release*" | head -1)
          open "$APP" --args --automation
          OK=no
          for i in $(seq 1 30); do
            if curl -s -m 2 http://127.0.0.1:8799/state | grep -q '"selected"'; then
              OK=yes
              break
            fi
            sleep 1
          done
          [ "$OK" = yes ] || { echo "::error::app never came up — eval suite needs the bridge"; exit 1; }

      - name: Agent eval suite (fixture endpoint, deterministic)
        run: |
          python3 tests/agent-eval.py --cleanup
          pkill -x Desire || true
          sleep 2

      - name: Locate app bundle
        id: app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Desire.app" -path "*Release*" | head -1)
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Launch smoke test + startup budget (0.6.4)
        run: |
          APP="${{ steps.app.outputs.path }}"
          # 0.6.4 性能预算：launch → /state 就绪的墙钟进入门禁。CI runner 比
          # 本机慢（本机基线 632ms / 预算 700ms）——门禁放宽到 2s 挡退化，
          # 实测值照常打印供趋势观察。冷启动首启会被字体/缓存拖长，取
          # 第二次启动的值（与本地探针手法一致）。
          open "$APP" --args --automation
          OK=no
          for i in $(seq 1 30); do
            if curl -s -m 2 http://127.0.0.1:8799/state | grep -q '"selected"'; then
              OK=yes
              break
            fi
            sleep 1
          done
          pkill -x Desire || true
          sleep 2
          # 第二次启动 = 预算测量对象（缓存已热）
          T0=$(python3 -c 'import time; print(time.time())')
          open "$APP" --args --automation
          READY=no
          for i in $(seq 1 30); do
            if curl -s -m 2 http://127.0.0.1:8799/state | grep -q '"selected"'; then
              READY=yes
              break
            fi
            sleep 0.2
          done
          T1=$(python3 -c 'import time; print(time.time())')
          ELAPSED=$(python3 -c "print(int(($T1 - $T0) * 1000))")
          echo "startup budget: ${ELAPSED}ms (gate 2000ms on CI; local budget 700ms)"
          STARTUP=$(log show --last 2m --predicate 'subsystem == "me.siwi.Desire"' --style compact 2>/dev/null | grep -c "startup: first window interactive" || true)
          echo "smoke: $OK / ready: $READY (startup log lines: $STARTUP)"
          pkill -x Desire || true
          [ "$OK" = yes ] || { echo "::error::launch smoke test failed — /state never answered"; exit 1; }
          [ "$READY" = yes ] || { echo "::error::second launch never became ready"; exit 1; }
          [ "$ELAPSED" -le 2000 ] || { echo "::error::startup budget blown on CI: ${ELAPSED}ms > 2000ms — investigate before release"; exit 1; }

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desire-${{ github.sha }}
          path: ${{ steps.app.outputs.path }}
          retention-days: 7
          if-no-files-found: error

  build-x86_64:
    name: Build check (x86_64)
    runs-on: macos-latest
    # Informational for now: the release ships arm64; Intel compile health
    # is tracked without blocking CI.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (Release, x86_64 cross-compile, unsigned)
        run: |
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -destination 'platform=macOS' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
