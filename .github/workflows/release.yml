name: Release

# 两条入口：
#   • workflow_dispatch(version, publish_on_success=true) → 一次运行内完成：单测 +
#     arm64/x86_64 并行零警告构建；**全部通过后才走到发布 job**，在那里创建 tag
#     （--target 本次已验证的 SHA；GITHUB_TOKEN 建的 tag 不会二次触发工作流）并上传
#     资产。构建失败 → 发布 job 不运行，**tag 与 Release 都不存在**，开发继续。
#     scripts/release.sh 只负责准备版本并触发，几秒返回。
#   • push tag vX.Y.Z → 手动/重推 tag 的路径：同样的构建 + **幂等发布**（Release 已
#     存在则复用/更新、资产 --clobber 覆盖）；发布阶段网络失败可 `gh run rerun
#     <id> --failed` 只重跑发布 job。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 0.7.26)'
        required: true
        type: string
      publish_on_success:
        description: 'Build, then create tag + publish only if the build passed'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

# 预发版与正式发布互不取消；同一 tag 的重推才取消旧 run。
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('preflight-{0}', github.sha) || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust build
        run: cargo build --workspace

  build-arm64:
    name: Build arm64 (zero warnings)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pure-logic unit tests
        run: bash tests/run.sh

      - name: Build and verify version
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-arm64" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee build-arm64.log
          if grep -E "warning:" build-arm64.log | grep -v appintentsmetadataprocessor | grep -q .; then
            echo "::error::arm64 build emitted warnings"
            grep -E "warning:" build-arm64.log | grep -v appintentsmetadataprocessor | head -20
            exit 1
          fi
          APP="$RUNNER_TEMP/dd-arm64/Build/Products/Release/Desire.app"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$VER" = "$V" ] || { echo "::error::built version $VER != expected $V"; exit 1; }

      - name: Package arm64
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/dd-arm64/Build/Products/Release/Desire.app" \
            "Desire-v$V-macos-arm64.zip"
          shasum -a 256 "Desire-v$V-macos-arm64.zip" > "SHASUMS256-arm64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: arm64
          path: |
            Desire-v*-macos-arm64.zip
            SHASUMS256-arm64.txt
          if-no-files-found: error

  build-x86_64:
    name: Build x86_64 (zero warnings)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build and verify version/arch
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-x86" \
            -destination 'platform=macOS' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee build-x86.log
          if grep -E "warning:" build-x86.log | grep -v appintentsmetadataprocessor | grep -q .; then
            echo "::error::x86_64 build emitted warnings"
            grep -E "warning:" build-x86.log | grep -v appintentsmetadataprocessor | head -20
            exit 1
          fi
          APP="$RUNNER_TEMP/dd-x86/Build/Products/Release/Desire.app"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$VER" = "$V" ] || { echo "::error::x86_64 built version $VER != expected $V"; exit 1; }
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Desire")
          [[ "$ARCHS" == *x86_64* ]] || { echo "::error::x86_64 binary missing: $ARCHS"; exit 1; }

      - name: Package x86_64
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/dd-x86/Build/Products/Release/Desire.app" \
            "Desire-v$V-macos-x86_64.zip"
          shasum -a 256 "Desire-v$V-macos-x86_64.zip" > "SHASUMS256-x86_64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64
          path: |
            Desire-v*-macos-x86_64.zip
            SHASUMS256-x86_64.txt
          if-no-files-found: error

  publish:
    name: Publish (idempotent)
    needs: [quality, build-arm64, build-x86_64]
    # tag push 直接发布；workflow_dispatch 则在**构建全部通过后**才走到这里——
    # 失败时本 job 不运行，tag 与 Release 都不会存在（铁律：发版必须成功）。
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_on_success == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: assets

      - name: Assemble checksums
        run: |
          set -euo pipefail
          cd assets
          cat SHASUMS256-arm64.txt SHASUMS256-x86_64.txt > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          TAG="v$V"
          sed "s|__TAG__|${TAG}|g" scripts/install-note.template.md > install-note.md
          if grep -qF "## [$TAG]" CHANGELOG.md; then
            awk -v tag="[$TAG]" '
              index($0, "## " tag) == 1 { flag = 1; next }
              flag && index($0, "## [") == 1 { exit }
              flag { print }
            ' CHANGELOG.md > body.md
            cat install-note.md >> body.md
          else
            printf 'Release %s\n' "$TAG" > body.md
            cat install-note.md >> body.md
          fi
          # 幂等：已存在就更新正文（重跑同一 tag 不报错）。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file body.md
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 预发版通过 → 现在才创建 tag（指向本次已验证的 SHA）；用 GITHUB_TOKEN
            # 创建的 tag 不会再触发一次 Release 工作流。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file body.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file body.md
          fi

      # 多资产一次性上传会偶发 408（本地发版时代实测）——逐个传 + 重试；
      # --clobber 让重跑直接补/覆盖，不需要删 tag。
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          TAG="v$V"
          cd assets
          for f in Desire-"$TAG"-macos-arm64.zip Desire-"$TAG"-macos-x86_64.zip SHASUMS256.txt; do
            OK=no
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then OK=yes; break; fi
              echo "upload $f failed (attempt $attempt) — retrying"
              sleep $((attempt * 10))
            done
            [ "$OK" = yes ] || { echo "::error::failed to upload $f"; exit 1; }
          done

      - name: Verify remote assets (size + sha256 digest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          python3 scripts/verify-release-assets.py "v$V" "$GITHUB_REPOSITORY" assets
