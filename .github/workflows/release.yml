name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package zip (symlink-safe)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Desire.app" -path "*Release*" | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "Desire-${{ github.ref_name }}-macos-arm64.zip"
          shasum -a 256 "Desire-${{ github.ref_name }}-macos-arm64.zip" > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # 安装说明的单一真相在 scripts/install-note.template.md（release.sh 同源）
          sed "s|__TAG__|${TAG}|g" scripts/install-note.template.md > install-note.md
          # Body: the tag's section from CHANGELOG.md + install note; fall
          # back to generated notes when the changelog lacks the section.
          # -F is required: [v0.1.5] would otherwise be a regex char class.
          if grep -qF "## [$TAG]" CHANGELOG.md; then
            awk -v tag="[$TAG]" '
              index($0, "## " tag) == 1 { flag = 1; next }
              flag && index($0, "## [") == 1 { exit }
              flag { print }
            ' CHANGELOG.md > body.md
            cat install-note.md >> body.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file body.md \
              "Desire-$TAG-macos-arm64.zip" \
              SHASUMS256.txt
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "Desire-$TAG-macos-arm64.zip" \
              SHASUMS256.txt
            gh release view "$TAG" --json body -q .body > body.md
            cat install-note.md >> body.md
            gh release edit "$TAG" --notes-file body.md
          fi
