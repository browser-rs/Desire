name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package zip (symlink-safe)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Desire.app" -path "*Release*" | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "Desire-${{ github.ref_name }}-macos-arm64.zip"
          shasum -a 256 "Desire-${{ github.ref_name }}-macos-arm64.zip" > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "Desire-${{ github.ref_name }}-macos-arm64.zip" \
            SHASUMS256.txt
          # Append the unsigned-build install note to the generated notes.
          gh release view "${{ github.ref_name }}" --json body -q .body > body.md
          cat >> body.md <<'EOF'

          ## Install

          Unsigned build (no Developer ID certificate on CI). After unzipping,
          remove the quarantine flag once:

          ```
          xattr -cr Desire.app
          ```

          Then open normally. Apple Silicon only.
          EOF
          gh release edit "${{ github.ref_name }}" --notes-file body.md
