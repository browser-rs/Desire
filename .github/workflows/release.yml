name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package zip (symlink-safe)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "Desire.app" -path "*Release*" | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "Desire-${{ github.ref_name }}-macos-arm64.zip"
          shasum -a 256 "Desire-${{ github.ref_name }}-macos-arm64.zip" > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > install-note.md <<'EOF'

          ---

          ## 安装

          未签名构建（CI 无 Developer ID 证书），仅支持 Apple Silicon（arm64，macOS 26.5+）。

          1. **解压** `Desire-__TAG__-macos-arm64.zip`（双击，或
             `ditto -x -k Desire-__TAG__-macos-arm64.zip .`）。
          2. **安装**：把解压出来的 **`Desire.app` 拖进 `/Applications`**。
          3. **移除一次隔离标记**（未签名构建必需），路径写**你放 app 的那个**：

          ```
          xattr -cr /Applications/Desire.app
          ```

          4. **打开** `Desire.app`。首次启动 Gatekeeper 会检查一次；做过第 3 步就能正常打开。

          > 报 `xattr: No such file: Desire.app` 说明当前目录里没有解压好的 app——
          > 命令要写完整路径（如 `/Applications/Desire.app`），或先 `cd` 到它所在目录。
          EOF
          sed -i '' "s|__TAG__|${TAG}|g" install-note.md
          # Body: the tag's section from CHANGELOG.md + install note; fall
          # back to generated notes when the changelog lacks the section.
          # -F is required: [v0.1.5] would otherwise be a regex char class.
          if grep -qF "## [$TAG]" CHANGELOG.md; then
            awk -v tag="[$TAG]" '
              index($0, "## " tag) == 1 { flag = 1; next }
              flag && index($0, "## [") == 1 { exit }
              flag { print }
            ' CHANGELOG.md > body.md
            cat install-note.md >> body.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file body.md \
              "Desire-$TAG-macos-arm64.zip" \
              SHASUMS256.txt
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "Desire-$TAG-macos-arm64.zip" \
              SHASUMS256.txt
            gh release view "$TAG" --json body -q .body > body.md
            cat install-note.md >> body.md
            gh release edit "$TAG" --notes-file body.md
          fi
