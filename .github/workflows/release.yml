name: Release

# 手动触发（scripts/release.sh 负责冻结版本并调度）：
#   workflow_dispatch(version, publish)
#   1) 与本地完全相同的 Xcode 27.1 (27A9275) + xcode-27 镜像，双架构零警告构建；
#   2) 构建全部通过后才执行 publish：用 GITHUB_TOKEN 创建 tag（--target 本次已验证
#      的 SHA）并上传资产——构建失败则 tag/Release 都不存在（铁律：发版必须成功）；
#   3) publish=false 可只跑构建（发版前自检）。
# 不监听 tag push：tag 只能由这条已验证的流水线创建，避免把未验证的 tag 发布出去。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 0.7.26)'
        required: true
        type: string
      publish:
        description: 'Publish (create tag + release) only if all builds pass'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust build
        run: cargo build --workspace

  build-arm64:
    name: Build arm64 (zero warnings)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1 (same build as local)
        run: |
          XCODE=/Applications/Xcode_27.1.app
          [ -d "$XCODE" ] || { echo "::error::pinned Xcode 27.1 missing"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27.1" || { echo "::error::expected Xcode 27.1"; exit 1; }

      - name: Pure-logic unit tests
        run: bash tests/run.sh

      - name: Build and verify version
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-arm64" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee build-arm64.log
          if grep -E "warning:" build-arm64.log | grep -v appintentsmetadataprocessor | grep -q .; then
            echo "::error::arm64 build emitted warnings"
            grep -E "warning:" build-arm64.log | grep -v appintentsmetadataprocessor | head -30
            exit 1
          fi
          APP="$RUNNER_TEMP/dd-arm64/Build/Products/Release/Desire.app"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$VER" = "$V" ] || { echo "::error::built version $VER != expected $V"; exit 1; }
          bash scripts/sign-app.sh "$APP"
          ditto -c -k --keepParent "$APP" "Desire-v$V-macos-arm64.zip"
          shasum -a 256 "Desire-v$V-macos-arm64.zip" > "SHASUMS256-arm64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: arm64
          path: |
            Desire-v*-macos-arm64.zip
            SHASUMS256-arm64.txt
          if-no-files-found: error

  build-x86_64:
    name: Build x86_64 (zero warnings)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1 (same build as local)
        run: |
          XCODE=/Applications/Xcode_27.1.app
          [ -d "$XCODE" ] || { echo "::error::pinned Xcode 27.1 missing"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 27.1" || { echo "::error::expected Xcode 27.1"; exit 1; }

      - name: Build and verify version/arch
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          xcodebuild \
            -project apps/macos/Desire.xcodeproj \
            -scheme Desire \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd-x86" \
            -destination 'platform=macOS' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build 2>&1 | tee build-x86.log
          if grep -E "warning:" build-x86.log | grep -v appintentsmetadataprocessor | grep -q .; then
            echo "::error::x86_64 build emitted warnings"
            grep -E "warning:" build-x86.log | grep -v appintentsmetadataprocessor | head -30
            exit 1
          fi
          APP="$RUNNER_TEMP/dd-x86/Build/Products/Release/Desire.app"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          [ "$VER" = "$V" ] || { echo "::error::x86_64 built version $VER != expected $V"; exit 1; }
          bash scripts/sign-app.sh "$APP"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Desire")
          [[ "$ARCHS" == *x86_64* ]] || { echo "::error::x86_64 binary missing: $ARCHS"; exit 1; }
          ditto -c -k --keepParent "$APP" "Desire-v$V-macos-x86_64.zip"
          shasum -a 256 "Desire-v$V-macos-x86_64.zip" > "SHASUMS256-x86_64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64
          path: |
            Desire-v*-macos-x86_64.zip
            SHASUMS256-x86_64.txt
          if-no-files-found: error

  publish:
    name: Create tag and publish (only after all builds pass)
    needs: [quality, build-arm64, build-x86_64]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: assets

      - name: Assemble checksums
        run: |
          set -euo pipefail
          cd assets
          cat SHASUMS256-arm64.txt SHASUMS256-x86_64.txt > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          sed "s|__TAG__|${TAG}|g" scripts/install-note.template.md > install-note.md
          if grep -qF "## [$TAG]" CHANGELOG.md; then
            awk -v tag="[$TAG]" '
              index($0, "## " tag) == 1 { flag = 1; next }
              flag && index($0, "## [") == 1 { exit }
              flag { print }
            ' CHANGELOG.md > body.md
            cat install-note.md >> body.md
          else
            printf 'Release %s\n' "$TAG" > body.md
            cat install-note.md >> body.md
          fi
          # 幂等：release 已存在（例如上次上传失败重跑）就更新正文。
          # --target 把 tag 创建在**本次已验证的提交**上；GITHUB_TOKEN 创建的
          # tag 不会再触发工作流。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file body.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file body.md
          fi

      - name: Upload assets (one by one, with retries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          cd assets
          for f in Desire-"$TAG"-macos-arm64.zip Desire-"$TAG"-macos-x86_64.zip SHASUMS256.txt; do
            OK=no
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then OK=yes; break; fi
              echo "upload $f failed (attempt $attempt) — retrying"
              sleep $((attempt * 10))
            done
            [ "$OK" = yes ] || { echo "::error::failed to upload $f"; exit 1; }
          done

      - name: Verify remote assets (size + sha256 digest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release-assets.py "v${{ inputs.version }}" "$GITHUB_REPOSITORY" assets
