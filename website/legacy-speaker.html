<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典蓝牙音箱 — 特惠中</title>
<style>
  body { font-family: "Times New Roman", "Songti SC", serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #2b2b2b; background: #fff; line-height: 1.8; }
  h1 { font-size: 1.4rem; }
  .price { color: #a00; font-size: 1.3rem; font-weight: bold; }
  .note { color: #777; font-size: 0.85rem; }
</style>
<!-- L0 演示：除 schema.org JSON-LD 外**不做任何 DPP 接入**——没有声明块、
     没有数据属性、没有 SDK。Desire 直接消费 JSON-LD（Product → 结构化字段，
     potentialAction → 动作），老旧页面零改造即可被智能体理解。 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "经典蓝牙音箱",
  "description": "12 小时续航，IPX5 防水，演示用示例商品。",
  "sku": "SPK-199",
  "offers": {
    "@type": "Offer",
    "price": "199.00",
    "priceCurrency": "CNY",
    "availability": "https://schema.org/InStock"
  },
  "potentialAction": [
    {
      "@type": "ViewAction",
      "name": "查看售后政策",
      "target": "https://desire.mankong.icu/?sku=SPK-199#after-sales"
    },
    {
      "@type": "ViewAction",
      "name": "查看同系列商品",
      "target": "https://desire.mankong.icu/?series={series}#list",
      "description": "按系列浏览（占位符会变成动作参数）"
    }
  ]
}
</script>
</head>
<body>
<h1>经典蓝牙音箱</h1>
<p class="price">¥199.00</p>
<p>12 小时续航 · IPX5 防水 · 重低音单元。<span class="note">（本页为 L0 演示：页面本身不知道 DPP 的存在。）</span></p>
<p><a href="/">← 返回 Desire 首页</a> · <a href="demo/">DPP 演示场</a></p>
</body>
</html>
